name: Actualización Semanal de Estadísticas NBA

on:
  schedule:
    # Corre todos los lunes a las 07:00 AM UTC (04:00 AM hora de Argentina/Uruguay)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  update-nba-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml nba_api

      - name: Extraer Estadísticas Oficiales NBA
        run: |
          python src/data_fetcher.py

      - name: Commit y Push de Datos Actualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/projections_sample.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Actualización automática de estadísticas oficiales NBA" && git push)
